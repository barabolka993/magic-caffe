<!DOCTYPE html>
<html lang="uk"
<head>
    <meta charset="UTF-8">
 <meta name="viewport"   content="width"=device-widht, initial-scale="1.0">
 <title>magic caffe | Бронювання</title>
 <link rel="stylesheet" href="style.css">
</head>
<div class="booking-card">
    <div class="magic-header">
        <h1>✨ Бронювання Столика ✨</h1>
        <p>Залиште заявку, і ми підготуємо зілля</p>
    </div>

    <form class="simple-form">
        <div class="field">
            <label>Ваше ім'я:</label>
            <input type="text" placeholder="Маг чи людина?">
        </div>

        <div class="field">
            <label>Оберіть залу:</label>
            <select>
                <option>Зала Тіней</option>
                <option>Кришталева кімната</option>
                <option>Куточок Алхіміка</option>
            </select>
        </div>

        <div class="field">
            <label>Час ритуалу:</label>
            <input type="datetime-local">
        </div>

        <button type="submit" class="submit-btn">ПІДТВЕРДИТИ</button>
    </form>
</div>
